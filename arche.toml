# arche-wasm — imports the arche repo's `gfx` device + stdlib (like arche-rpg).
# `[lib] paths` add those as module-search roots so the gfx demo can `#import { gfx }`.
# (Adjust if you cloned arche somewhere other than ../arche.)
[lib]
paths = ["../arche/extras", "../arche/stdlib"]

# gfx backend: "wasm" = a shim-less variant whose gfx_be_* become wasm imports the browser host
# fulfils (it blits the framebuffer to a <canvas>). Override for a native window/headless run, e.g.
# ARCHE_SELECT=gfx=headless (PPM dump) or ARCHE_SELECT=gfx=x11.
[select]
gfx = "wasm"
# text device: on the web we default to "dom" — real browser fonts as <span>s over the canvas (via
# www/text.js), positioned at the driver's projected screen coords so they scroll with the world. The
# native `make dev` path selects "framebuffer" instead (bitmap font into the shared framebuffer — no DOM).
text = "dom"
