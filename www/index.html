<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arche</title>
  <style>
    /* The page IS the app: one full-viewport canvas, no chrome. The canvas fills the whole window and its
       backing store is sized by the host (gfx.js) to the window's aspect — fixed render HEIGHT, dynamic
       WIDTH — so the image exactly fits with no bars on any side and no distortion; widening the window
       reveals more world rather than stretching. It re-sizes live on window resize. */
    html, body { margin: 0; height: 100%; background: #12131c; overflow: hidden; }
    #screen { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="screen" data-status="idle"></canvas>
  <script src="wasi.js"></script>
  <script src="gfx.js"></script>
  <script src="main.js"></script>
</body>
</html>
