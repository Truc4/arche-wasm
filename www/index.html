<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arche</title>
  <style>
    /* The page IS the app: one full-viewport canvas, no chrome. The canvas backing store is the wasm
       program's native resolution; object-fit:contain letterboxes it into the viewport (pure CSS, scales
       up or down, preserves aspect), and pixelated keeps it crisp when magnified. */
    html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
    #screen { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="screen" data-status="idle"></canvas>
  <script src="wasi.js"></script>
  <script src="gfx.js"></script>
  <script src="main.js"></script>
</body>
</html>
